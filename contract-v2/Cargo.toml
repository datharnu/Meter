[package]
name = "meter-v2"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0"
near-sys = "=0.4.0"
hex = "0.4"
sha2 = "0.10"
unicode-normalization = "0.1"

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
