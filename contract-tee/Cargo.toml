[package]
name = "meter-tee"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.0", features = ["unstable"] }
near-sys = "=0.4.0"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing", "unstable"] }
k256 = { version = "0.13", features = ["ecdsa"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
