name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust unit tests (contract)
        run: cargo test
        working-directory: contract
      - name: Rust unit tests (contract-tee)
        run: cargo test
        working-directory: contract-tee
      - name: Rust unit tests (contract-v2)
        run: cargo test
        working-directory: contract-v2
      - name: Desk rule and line hash
        run: node --test app/lib/rule.test.mjs chain/line.test.mjs
      - name: Re-read receipts on chain (with RPC retries)
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "verify attempt $attempt"
            if node chain/verify.mjs; then exit 0; fi
            sleep $((attempt * 15))
          done
          exit 1
