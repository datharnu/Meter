name: check

on:
  push:
  pull_request:

jobs:
  rule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Desk rule and line hash
        run: node --test app/lib/rule.test.mjs chain/line.test.mjs
